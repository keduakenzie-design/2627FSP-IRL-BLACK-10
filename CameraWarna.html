<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendeteksi Warna Kamera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#e9e9e7;--surface:#f6f6f4;--ink:#1c1c1b;--muted:#6a6a67;--line:#cfcfcb;--accent:#2b2b2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1c;--surface:#272726;--ink:#efefed;--muted:#a0a09c;--line:#3c3c3a;--accent:#efefed;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1d1c;--surface:#272726;--ink:#efefed;--muted:#a0a09c;--line:#3c3c3a;--accent:#efefed;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:4px 0 12px}
.stage{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;touch-action:none;aspect-ratio:3/4;max-height:62vh;margin:0 auto}
.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage img{display:none}
.ret{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000;pointer-events:none;left:50%;top:50%}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#ddd;font-size:15px}
.card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.sw{width:76px;height:76px;border-radius:10px;border:1px solid var(--line);flex:none;background:#888}
.name{font:700 26px/1.1 "Bricolage Grotesque",system-ui,sans-serif}
.vals{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,label.btn{font:500 15px "IBM Plex Sans",system-ui,sans-serif;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
button.main{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;font-size:13px;min-height:40px}
.chip i{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:block}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<main>
<h1>Pendeteksi warna</h1>
<div class="stage" id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <img id="pic" alt="Foto yang dipilih">
  <div class="msg" id="msg">Mengaktifkan kamera…</div>
  <div class="ret" id="ret"></div>
</div>
<p class="hint">Arahkan lingkaran ke objek. Ketuk layar untuk memindahkan titik ukur.</p>

<div class="card" aria-live="polite">
  <div class="sw" id="sw"></div>
  <div>
    <div class="name" id="name">—</div>
    <div class="vals" id="hex">#------</div>
    <div class="vals" id="rgb">RGB —</div>
    <div class="vals" id="hsl">HSL —</div>
  </div>
</div>

<div class="row">
  <button class="main" id="save">Simpan warna</button>
  <button id="copy">Salin HEX</button>
  <button id="flip">Balik kamera</button>
  <label class="btn">Ambil foto<input type="file" id="file2" accept="image/*" capture="environment"></label>
  <label class="btn">Pilih foto<input type="file" id="file" accept="image/*"></label>
</div>
<div class="pal" id="pal"></div>
</main>

<script>
(function(){
var vid=document.getElementById('vid'),pic=document.getElementById('pic'),stage=document.getElementById('stage'),
ret=document.getElementById('ret'),msg=document.getElementById('msg');
var cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
var px=0.5,py=0.5,facing='environment',stream=null,mode='cam',cur={r:128,g:128,b:128,hex:'#808080',name:'—'};

function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
 if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
  if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}
 return{h:h,s:s,l:l}}

function nameOf(r,g,b){var c=rgb2hsl(r,g,b),h=c.h,s=c.s,l=c.l;
 if(l<0.1)return'Hitam';
 if(l>0.93)return'Putih';
 if(s<0.1){return l<0.3?'Abu-abu tua':l>0.72?'Abu-abu muda':'Abu-abu'}
 var n;
 if(h<15||h>=345){n=l>0.72?'Merah muda':l<0.25?'Merah marun':'Merah'}
 else if(h<42){n=l<0.4?'Cokelat':l>0.75?'Krem':'Oranye'}
 else if(h<68){n=l<0.4?'Cokelat zaitun':l>0.8?'Krem':'Kuning'}
 else if(h<165){n=l<0.25?'Hijau tua':l>0.75?'Hijau muda':'Hijau'}
 else if(h<200){n='Toska'}
 else if(h<255){n=l<0.25?'Biru tua':l>0.75?'Biru muda':'Biru'}
 else if(h<290){n=l>0.75?'Lavender':'Ungu'}
 else{n=l>0.75?'Merah muda':'Magenta'}
 return n}

function hex(v){return('0'+Math.round(v).toString(16)).slice(-2)}

function source(){
 if(mode==='img'&&pic.naturalWidth)return{el:pic,w:pic.naturalWidth,h:pic.naturalHeight};
 if(mode==='cam'&&vid.videoWidth)return{el:vid,w:vid.videoWidth,h:vid.videoHeight};
 return null}

function fitStage(w,h){stage.style.aspectRatio=w+'/'+h}

function sample(){
 var s=source();if(!s)return;
 var size=Math.max(6,Math.round(Math.min(s.w,s.h)*0.025));
 var x=Math.round(px*s.w-size/2),y=Math.round(py*s.h-size/2);
 x=Math.max(0,Math.min(s.w-size,x));y=Math.max(0,Math.min(s.h-size,y));
 cv.width=size;cv.height=size;
 try{cx.drawImage(s.el,x,y,size,size,0,0,size,size);
  var d=cx.getImageData(0,0,size,size).data,r=0,g=0,b=0,n=d.length/4;
  for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
  r/=n;g/=n;b/=n;
  cur={r:r,g:g,b:b,hex:'#'+hex(r)+hex(g)+hex(b),name:nameOf(r,g,b)};
  render()}catch(e){}}

function render(){
 var c=cur,hs=rgb2hsl(c.r,c.g,c.b);
 document.getElementById('sw').style.background=c.hex;
 document.getElementById('name').textContent=c.name;
 document.getElementById('hex').textContent=c.hex.toUpperCase();
 document.getElementById('rgb').textContent='RGB '+Math.round(c.r)+', '+Math.round(c.g)+', '+Math.round(c.b);
 document.getElementById('hsl').textContent='HSL '+Math.round(hs.h)+'°, '+Math.round(hs.s*100)+'%, '+Math.round(hs.l*100)+'%'}

function place(){ret.style.left=(px*100)+'%';ret.style.top=(py*100)+'%'}

stage.addEventListener('pointerdown',function(e){
 var r=stage.getBoundingClientRect();
 px=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
 py=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
 place();sample()});

var last=0;
function loop(t){requestAnimationFrame(loop);
 if(mode!=='cam'||t-last<90)return;last=t;
 if(vid.videoWidth&&stage.dataset.fit!==vid.videoWidth+'x'+vid.videoHeight){
  stage.dataset.fit=vid.videoWidth+'x'+vid.videoHeight;fitStage(vid.videoWidth,vid.videoHeight)}
 sample()}

function start(){
 if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
 mode='cam';pic.style.display='none';vid.style.display='block';
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail();return}
 msg.style.display='flex';msg.textContent='Mengaktifkan kamera…';
 navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}).then(function(s){
  stream=s;vid.srcObject=s;msg.style.display='none';stage.dataset.fit=''}).catch(fail)}

function fail(){msg.style.display='flex';
 msg.textContent='Kamera langsung tidak bisa dibuka di halaman ini. Ketuk “Ambil foto” untuk memakai kamera ponsel, lalu ketuk bagian foto yang ingin diukur warnanya.'}

document.getElementById('flip').onclick=function(){facing=facing==='environment'?'user':'environment';start()};

var onFile=function(e){
 var f=e.target.files&&e.target.files[0];if(!f)return;
 var u=URL.createObjectURL(f);
 pic.onload=function(){mode='img';vid.style.display='none';pic.style.display='block';
  msg.style.display='none';fitStage(pic.naturalWidth,pic.naturalHeight);
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  sample()};
 pic.src=u};
document.getElementById('file').onchange=onFile;document.getElementById('file2').onchange=onFile;

var saved=[];
function drawPal(){var p=document.getElementById('pal');p.innerHTML='';
 saved.forEach(function(c){var b=document.createElement('button');b.className='chip';
  b.title='Ketuk untuk menyalin '+c.hex;
  b.innerHTML='<i style="background:'+c.hex+'"></i><span>'+c.name+' '+c.hex.toUpperCase()+'</span>';
  b.onclick=function(){copy(c.hex.toUpperCase())};p.appendChild(b)})}

document.getElementById('save').onclick=function(){
 saved.unshift({hex:cur.hex,name:cur.name});saved=saved.slice(0,12);drawPal()};

function copy(t){
 try{navigator.clipboard.writeText(t).then(function(){flash('Tersalin: '+t)},function(){flash(t)})}
 catch(e){flash(t)}}
function flash(t){var b=document.getElementById('copy'),o='Salin HEX';b.textContent=t;setTimeout(function(){b.textContent=o},1500)}
document.getElementById('copy').onclick=function(){copy(cur.hex.toUpperCase())};

place();render();start();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

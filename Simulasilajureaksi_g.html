<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Laju Reaksi - Pemilihan Unsur & Katalis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b132b;
    --card: #1c2541;
    --accent: #64dfdf;
    --accent-hover: #70e4e8;
    --text: #edf2f4;
    --text-dim: #8d99ae;
    --border: #3a506b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 1150px;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
  }

  @media (max-width: 950px) {
    .container { grid-template-columns: 1fr; }
  }

  header {
    grid-column: 1 / -1;
    text-align: center;
    margin-bottom: 5px;
  }

  h1 { margin: 0 0 6px; font-size: 26px; color: var(--accent); }
  p.subtitle { margin: 0; color: var(--text-dim); font-size: 14px; }

  .sim-area {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .canvas-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
  }

  canvas {
    width: 100%;
    height: 380px;
    background: #080c19;
    border-radius: 8px;
    display: block;
  }

  .reaction-banner {
    background: rgba(11, 19, 43, 0.8);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    text-align: center;
    font-weight: 600;
    color: var(--accent);
    font-size: 15px;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
    font-size: 13px;
    flex-wrap: wrap;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .control-group {
    margin-bottom: 14px;
  }

  .control-group:last-child { margin-bottom: 0; }

  label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    padding: 9px 12px;
    background: #0b132b;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  select:focus { border-color: var(--accent); }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
    background: rgba(11, 19, 43, 0.5);
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .checkbox-group input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat-box {
    background: rgba(11, 19, 43, 0.6);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 8px;
    text-align: center;
  }

  .stat-box .val {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-top: 4px;
  }

  .stat-box .lbl {
    font-size: 11px;
    color: var(--text-dim);
  }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-primary { background: var(--accent); color: #0b132b; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: #3a506b; color: var(--text); }
  .btn-secondary:hover { background: #4c6685; }

  .info-tag {
    font-size: 11.5px;
    color: #48cae4;
    margin-top: 4px;
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Simulasi Laju Reaksi & Katalis</h1>
    <p class="subtitle">Eksperimen Teori Tumbukan dengan Pemilihan Unsur Kimia</p>
  </header>

  <div class="sim-area">
    <div class="canvas-card">
      <div class="reaction-banner" id="reactionEq">
        Reaksi: -
      </div>

      <canvas id="simCanvas"></canvas>

      <div class="legend" id="legendBox">
        <!-- Dinamis diisi dari JS -->
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <h2>1. Pilih Reaksi Kimia</h2>
      
      <div class="control-group">
        <label>Pasangan Reaktan:</label>
        <select id="selectReaction">
          <option value="haberschmitt">Sintesis Amonia: N₂ + H₂ → NH₃</option>
          <option value="water">Sintesis Air: H₂ + O₂ → H₂O</option>
          <option value="sulfur">Proses Kontak: SO₂ + O₂ → SO₃</option>
          <option value="decomposition">Urai Hidrogen Peroksida: H₂O₂ → H₂O + O₂</option>
        </select>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="inputCatalyst">
        <div>
          <span>Gunakan Katalis <strong id="catalystName">(-)</strong></span>
          <span class="info-tag" id="catalystInfo">Menurunkan Energi Aktivasi (Ea)</span>
        </div>
      </label>
    </div>

    <div class="card">
      <h2>2. Atur Parameter</h2>
      
      <div class="control-group">
        <label>Konsentrasi Reaktan: <span id="valConc">20</span> pasang</label>
        <input type="range" id="inputConc" min="6" max="36" value="20">
      </div>

      <div class="control-group">
        <label>Suhu (Sistem): <span id="valTemp">300</span> K</label>
        <input type="range" id="inputTemp" min="200" max="600" value="300" step="20">
      </div>

      <div class="btn-group">
        <button class="btn-primary" id="btnStart">Mulai Reaksi</button>
        <button class="btn-secondary" id="btnReset">Reset</button>
      </div>
    </div>

    <div class="card">
      <h2>Statistik Reaksi</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="lbl">Waktu Reaksi</div>
          <div class="val" id="statTime">0.0s</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Total Tumbukan</div>
          <div class="val" id="statCollisions">0</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Tumbukan Efektif</div>
          <div class="val" id="statEffective">0</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Molekul Produk</div>
          <div class="val" id="statProducts">0</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Data Reaksi Kimia Realistis
const REACTIONS = {
  haberschmitt: {
    name: "Sintesis Amonia (Proses Haber-Bosch)",
    eq: "N₂ (Nitrogen) + 3H₂ (Hidrogen) → 2NH₃ (Amonia)",
    r1: { label: "N₂", color: "#3a86ff" },
    r2: { label: "H₂", color: "#ff006e" },
    prod: { label: "NH₃", color: "#8338ec" },
    catalyst: "Besi (Fe)",
    baseEa: 5.2,
    catEa: 2.6
  },
  water: {
    name: "Pembentukan Air",
    eq: "2H₂ (Hidrogen) + O₂ (Oksigen) → 2H₂O (Air)",
    r1: { label: "H₂", color: "#ff006e" },
    r2: { label: "O₂", color: "#ffbe0b" },
    prod: { label: "H₂O", color: "#00b4d8" },
    catalyst: "Platina (Pt)",
    baseEa: 5.8,
    catEa: 2.2
  },
  sulfur: {
    name: "Oksidasi Sulfur Dioksida",
    eq: "2SO₂ (Sulfur Dioksida) + O₂ → 2SO₃ (Sulfur Trioksida)",
    r1: { label: "SO₂", color: "#fb5607" },
    r2: { label: "O₂", color: "#ffbe0b" },
    prod: { label: "SO₃", color: "#ff006e" },
    catalyst: "Vanadium Pentoksida (V₂O₅)",
    baseEa: 4.8,
    catEa: 2.1
  },
  decomposition: {
    name: "Penguraian Hidrogen Peroksida",
    eq: "2H₂O₂ (Hidrogen Peroksida) → 2H₂O + O₂",
    r1: { label: "H₂O₂", color: "#00f5d4" },
    r2: { label: "H₂O₂", color: "#00f5d4" },
    prod: { label: "H₂O + O₂", color: "#7b2cbf" },
    catalyst: "Mangan(IV) Oksida (MnO₂)",
    baseEa: 4.2,
    catEa: 1.8
  }
};

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resizeCanvas();

// Game State
let particles = [];
let isRunning = false;
let startTime = 0;
let elapsedTime = 0;
let totalCollisions = 0;
let effectiveCollisions = 0;

// UI Elements
const selectReaction = document.getElementById('selectReaction');
const inputConc = document.getElementById('inputConc');
const inputTemp = document.getElementById('inputTemp');
const inputCatalyst = document.getElementById('inputCatalyst');
const btnStart = document.getElementById('btnStart');
const btnReset = document.getElementById('btnReset');

const valConc = document.getElementById('valConc');
const valTemp = document.getElementById('valTemp');
const statTime = document.getElementById('statTime');
const statCollisions = document.getElementById('statCollisions');
const statEffective = document.getElementById('statEffective');
const statProducts = document.getElementById('statProducts');

const reactionEq = document.getElementById('reactionEq');
const catalystName = document.getElementById('catalystName');
const legendBox = document.getElementById('legendBox');

function getActiveReaction() {
  return REACTIONS[selectReaction.value];
}

function updateReactionUI() {
  const rxn = getActiveReaction();
  reactionEq.textContent = rxn.eq;
  catalystName.textContent = rxn.catalyst;
  
  legendBox.innerHTML = `
    <div class="legend-item"><div class="dot" style="background: ${rxn.r1.color}"></div> Reaktan: ${rxn.r1.label}</div>
    ${rxn.r1.label !== rxn.r2.label ? `<div class="legend-item"><div class="dot" style="background: ${rxn.r2.color}"></div> Reaktan: ${rxn.r2.label}</div>` : ''}
    <div class="legend-item"><div class="dot" style="background: ${rxn.prod.color}"></div> Produk: ${rxn.prod.label}</div>
  `;
}

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'r1', 'r2', or 'prod'
    this.radius = 9;
    this.vx = 0;
    this.vy = 0;
    this.updateSpeed();
  }

  updateSpeed() {
    if (this.type === 'prod') {
      // Produk bergerak lambat setelah reaksi
      this.vx *= 0.8;
      this.vy *= 0.8;
      return;
    }
    const temp = parseFloat(inputTemp.value);
    const speed = Math.sqrt(temp / 80) * (1.2 + Math.random() * 0.6);
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
  }

  move() {
    this.x += this.vx;
    this.y += this.vy;

    // Memantul dari dinding canvas
    if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
    if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
    if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
    if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; }
  }

  draw() {
    const rxn = getActiveReaction();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

    if (this.type === 'r1') ctx.fillStyle = rxn.r1.color;
    else if (this.type === 'r2') ctx.fillStyle = rxn.r2.color;
    else ctx.fillStyle = rxn.prod.color;

    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#ffffff55';
    ctx.stroke();

    // Teks Label Singkat Bidak
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px Inter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let label = this.type === 'r1' ? rxn.r1.label : (this.type === 'r2' ? rxn.r2.label : rxn.prod.label);
    ctx.fillText(label.split(' ')[0], this.x, this.y);
  }
}

function initParticles() {
  particles = [];
  const count = parseInt(inputConc.value);

  // Spawn Reaktan 1
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(
      Math.random() * (canvas.width - 40) + 20,
      Math.random() * (canvas.height - 40) + 20,
      'r1'
    ));
  }

  // Spawn Reaktan 2
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(
      Math.random() * (canvas.width - 40) + 20,
      Math.random() * (canvas.height - 40) + 20,
      'r2'
    ));
  }
}

function checkCollisions() {
  const rxn = getActiveReaction();
  const hasCatalyst = inputCatalyst.checked;
  
  // Batas Energi Aktivasi tergantung katalis
  const requiredEa = hasCatalyst ? rxn.catEa : rxn.baseEa;

  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      let p1 = particles[i];
      let p2 = particles[j];

      if (p1.type === 'prod' || p2.type === 'prod') continue;

      let dx = p2.x - p1.x;
      let dy = p2.y - p1.y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < p1.radius + p2.radius) {
        // Hanya tumbukan antar dua reaktan berbeda (atau dua peroksida) yang valid
        if ((p1.type === 'r1' && p2.type === 'r2') || (p1.type === 'r2' && p2.type === 'r1') || selectReaction.value === 'decomposition') {
          totalCollisions++;

          // Hitung kelajuan relatif sebagai representasi Energi Kinetik tumbukan
          let relSpeed = Math.sqrt(p1.vx*p1.vx + p1.vy*p1.vy + p2.vx*p2.vx + p2.vy*p2.vy);

          if (relSpeed >= requiredEa) {
            // TUMBUKAN EFEKTIF -> Menjadi Produk
            effectiveCollisions++;
            p1.type = 'prod';
            p1.vx *= 0.3; p1.vy *= 0.3; // Produk bergerak santai
            
            // Hapus reaktan pasangannya
            particles.splice(j, 1);
            
            // Efek Flash Visual Ringan
            createSpark(p1.x, p1.y, rxn.prod.color);
            break;
          } else {
            // Tumbukan Tidak Efektif -> Memantul Biasa
            bounce(p1, p2);
          }
        } else {
          bounce(p1, p2);
        }
      }
    }
  }
}

function bounce(p1, p2) {
  let tempVx = p1.vx;
  let tempVy = p1.vy;
  p1.vx = p2.vx;
  p1.vy = p2.vy;
  p2.vx = tempVx;
  p2.vy = tempVy;
}

let sparks = [];
function createSpark(x, y, color) {
  for(let i=0; i<6; i++) {
    sparks.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1.0, color: color
    });
  }
}

function drawSparks() {
  for(let i = sparks.length - 1; i >= 0; i--) {
    let s = sparks[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.05;
    if(s.life <= 0) {
      sparks.splice(i, 1);
      continue;
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = s.life;
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let productCount = 0;
  particles.forEach(p => {
    if (isRunning) p.move();
    p.draw();
    if (p.type === 'prod') productCount++;
  });

  drawSparks();

  if (isRunning) {
    checkCollisions();
    elapsedTime = (Date.now() - startTime) / 1000;

    // Cek jika reaktan sudah habis
    const remainingReactants = particles.filter(p => p.type !== 'prod').length;
    if (remainingReactants <= 1) {
      isRunning = false;
      btnStart.textContent = 'Mulai Reaksi';
    }
  }

  // Update Statistik
  statTime.textContent = elapsedTime.toFixed(1) + 's';
  statCollisions.textContent = totalCollisions;
  statEffective.textContent = effectiveCollisions;
  statProducts.textContent = productCount;

  requestAnimationFrame(update);
}

function resetSim() {
  isRunning = false;
  btnStart.textContent = 'Mulai Reaksi';
  elapsedTime = 0;
  totalCollisions = 0;
  effectiveCollisions = 0;
  sparks = [];
  initParticles();
}

// Event Listeners
selectReaction.onchange = () => {
  updateReactionUI();
  resetSim();
};

inputConc.oninput = () => {
  valConc.textContent = inputConc.value;
  if (!isRunning) resetSim();
};

inputTemp.oninput = () => {
  valTemp.textContent = inputTemp.value;
  if (isRunning) {
    particles.forEach(p => p.updateSpeed());
  }
};

btnStart.onclick = () => {
  if (!isRunning) {
    const remainingReactants = particles.filter(p => p.type !== 'prod').length;
    if (remainingReactants <= 1) resetSim();
    isRunning = true;
    startTime = Date.now() - (elapsedTime * 1000);
    particles.forEach(p => p.updateSpeed());
    btnStart.textContent = 'Jeda';
  } else {
    isRunning = false;
    btnStart.textContent = 'Lanjutkan';
  }
};

btnReset.onclick = resetSim;
window.onresize = resizeCanvas;

// Inisialisasi
updateReactionUI();
resetSim();
update();
</script>
</body>
</html>
